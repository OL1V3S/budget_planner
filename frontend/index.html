<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="frontend/assets/images/budget_planner_favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("budget-planner-theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch { /* System theme remains the safe default. */ }
      })();
    </script>
    <title>Budget Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
